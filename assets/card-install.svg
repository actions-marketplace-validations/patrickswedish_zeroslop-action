<svg xmlns="http://www.w3.org/2000/svg" width="580" height="92" viewBox="0 0 580 92" role="img" aria-labelledby="t1 d1">
  <title id="t1">GitHub Marketplace — Install Action Now</title>
  <desc id="d1">Install ZeroSlop on GitHub Marketplace and try 1 PR free.</desc>
  <defs>
    <style>
      .glow-stroke { animation: borderPulse 3s ease-in-out infinite; }
      .laser-sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px rgba(227, 49, 38, 0.25)); }
        50% { stroke-opacity: 0.90; filter: drop-shadow(0 0 10px rgba(227, 49, 38, 0.75)); }
      }
      @keyframes sweep {
        0% { transform: translateX(-160px); opacity: 0; }
        20% { opacity: 0.25; }
        45%, 100% { transform: translateX(650px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow-stroke, .laser-sweep { animation: none; }
      }
    </style>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#140E10"/>
      <stop offset="1" stop-color="#0A0708"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E33126"/>
      <stop offset="1" stop-color="#FF5544"/>
    </linearGradient>
    <linearGradient id="sheen1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E33126" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="clip1">
      <rect width="580" height="92" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip1)">
    <!-- Base Background & Grid -->
    <rect width="580" height="92" fill="url(#bg1)"/>
    <rect width="580" height="92" fill="url(#grid1)"/>
    
    <!-- Animated Laser Sheen -->
    <rect class="laser-sweep" x="0" y="0" width="130" height="92" fill="url(#sheen1)" transform="skewX(-20)"/>

    <!-- Left Accent Pill -->
    <rect width="5" height="92" fill="url(#cyanAccent)"/>

    <!-- Left Icon Squircle (52x52) -->
    <g transform="translate(20, 20)">
      <rect width="52" height="52" rx="13" fill="#2B0E0D" stroke="#E33126" stroke-opacity="0.5" stroke-width="1.2"/>
      <g fill="none" stroke="#E33126" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="26" cy="26" r="14" stroke="#FF5544" stroke-width="1.8"/>
        <path d="M 19 26 L 24 31 L 33 21"/>
      </g>
    </g>

    <!-- Typography — Sovereign Title Only -->
    <text x="92" y="53" fill="#F4F0E8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.3">DON&apos;T WAIT, START TODAY</text>

    <!-- Outer Animated Glow Border -->
    <rect class="glow-stroke" x="0.5" y="0.5" width="579" height="91" rx="13.5" fill="none" stroke="#E33126" stroke-width="1.2"/>
  </g>
</svg>

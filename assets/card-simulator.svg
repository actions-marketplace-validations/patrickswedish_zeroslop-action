<svg xmlns="http://www.w3.org/2000/svg" width="580" height="92" viewBox="0 0 580 92" role="img" aria-labelledby="t3 d3">
  <title id="t3">Try Interactive Diff Simulator</title>
  <desc id="d3">Launch the 184-line slop to 4-line surgical invariant simulator.</desc>
  <defs>
    <style>
      .glow-emerald { animation: borderPulseEmerald 3s ease-in-out infinite; }
      .laser-sweep-emerald { animation: sweepEmerald 6s ease-in-out infinite; }
      @keyframes borderPulseEmerald {
        0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px rgba(52, 211, 153, 0.25)); }
        50% { stroke-opacity: 0.90; filter: drop-shadow(0 0 10px rgba(52, 211, 153, 0.75)); }
      }
      @keyframes sweepEmerald {
        0% { transform: translateX(-160px); opacity: 0; }
        20% { opacity: 0.25; }
        45%, 100% { transform: translateX(650px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow-emerald, .laser-sweep-emerald { animation: none; }
      }
    </style>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040913"/>
      <stop offset="0.5" stop-color="#06161D"/>
      <stop offset="1" stop-color="#0B2329"/>
    </linearGradient>
    <linearGradient id="emeraldAccent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="sheen3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#75B5DE" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="clip3">
      <rect width="580" height="92" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip3)">
    <!-- Base Background & Grid -->
    <rect width="580" height="92" fill="url(#bg3)"/>
    <rect width="580" height="92" fill="url(#grid3)"/>
    
    <!-- Animated Laser Sheen -->
    <rect class="laser-sweep-emerald" x="0" y="0" width="130" height="92" fill="url(#sheen3)" transform="skewX(-20)"/>

    <!-- Left Accent Pill -->
    <rect width="5" height="92" fill="url(#emeraldAccent3)"/>

    <!-- Left Icon Squircle (52x52) -->
    <g transform="translate(20, 20)">
      <rect width="52" height="52" rx="13" fill="#071F1B" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
      <g fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 16 19 L 26 19 M 16 26 L 22 26 M 16 33 L 30 33"/>
        <circle cx="35" cy="26" r="4.5" fill="#34D399" fill-opacity="0.25"/>
      </g>
    </g>

    <!-- Typography — Sovereign Title Only -->
    <text x="92" y="53" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.3">TRY WEB SIMULATOR</text>

    <!-- Outer Animated Glow Border -->
    <rect class="glow-emerald" x="0.5" y="0.5" width="579" height="91" rx="13.5" fill="none" stroke="#34D399" stroke-width="1.2"/>
  </g>
</svg>

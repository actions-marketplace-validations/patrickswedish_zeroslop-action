<svg xmlns="http://www.w3.org/2000/svg" width="580" height="84" viewBox="0 0 580 84" role="img" aria-labelledby="title desc">
  <title id="title">Get ZeroSlop Pro License</title>
  <desc id="desc">Activate ZeroSlop Pro and Enterprise license keys via Ribbsaeter Systems.</desc>
  <defs>
    <style>
      .card-border-gold { animation: pulseGlowGold 3s ease-in-out infinite; }
      .sheen-gold { animation: sheenPassGold 6s ease-in-out infinite; }
      @keyframes pulseGlowGold {
        0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px rgba(255, 184, 0, 0.25)); }
        50% { stroke-opacity: 0.85; filter: drop-shadow(0 0 8px rgba(255, 184, 0, 0.65)); }
      }
      @keyframes sheenPassGold {
        0% { transform: translateX(-180px); opacity: 0; }
        25% { opacity: 0.20; }
        50%, 100% { transform: translateX(620px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card-border-gold, .sheen-gold { animation: none; }
      }
    </style>
    <linearGradient id="bgGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040913"/>
      <stop offset="0.5" stop-color="#0B1522"/>
      <stop offset="1" stop-color="#161B2E"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="sheenGradGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFBE8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFBE8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFBE8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridGold" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#75B5DE" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="cardClipGold">
      <rect width="580" height="84" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipGold)">
    <rect width="580" height="84" fill="url(#bgGold)"/>
    <rect width="580" height="84" fill="url(#gridGold)"/>
    
    <rect class="sheen-gold" x="0" y="0" width="140" height="84" fill="url(#sheenGradGold)" transform="skewX(-20)"/>

    <rect width="5" height="84" fill="url(#accentGold)"/>

    <!-- Icon Box -->
    <g transform="translate(20, 18)">
      <rect width="48" height="48" rx="12" fill="#1C1810" stroke="#FFB800" stroke-opacity="0.4" stroke-width="1.2"/>
      <g fill="none" stroke="#FFB800" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="15" y="21" width="18" height="15" rx="3.5"/>
        <path d="M 19 21 L 19 16 A 5 5 0 0 1 29 16 L 29 21"/>
        <circle cx="24" cy="28.5" r="2" fill="#FFB800"/>
      </g>
    </g>

    <text x="82" y="34" fill="#FFB800" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" letter-spacing="2">RIBBSAETER SYSTEMS · INSTANT PRO KEY</text>
    <text x="82" y="58" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.2">GET PRO LICENSE</text>

    <!-- Right Action Pill -->
    <g transform="translate(440, 24)">
      <rect width="118" height="36" rx="9" fill="#241B08" stroke="#FFB800" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="48" y="23" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">$29 / MO</text>
      <text x="98" y="23" text-anchor="middle" fill="#FFB800" font-family="Arial, sans-serif" font-size="14" font-weight="900">➔</text>
    </g>

    <rect class="card-border-gold" x="0.5" y="0.5" width="579" height="83" rx="13.5" fill="none" stroke="#FFB800" stroke-width="1.2"/>
  </g>
</svg>

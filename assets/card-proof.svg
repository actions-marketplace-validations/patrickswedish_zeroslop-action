<svg xmlns="http://www.w3.org/2000/svg" width="580" height="92" viewBox="0 0 580 92" role="img" aria-labelledby="t4 d4">
  <title id="t4">View Upstream Wall of Proof</title>
  <desc id="d4">Browse 17 verified merged upstream pull requests across Hugging Face, Meta, DuckDB, Tokio, etc.</desc>
  <defs>
    <style>
      .glow-gold { animation: borderPulseGold 3s ease-in-out infinite; }
      .laser-sweep-gold { animation: sweepGold 6s ease-in-out infinite; }
      @keyframes borderPulseGold {
        0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px rgba(185, 160, 109, 0.25)); }
        50% { stroke-opacity: 0.90; filter: drop-shadow(0 0 10px rgba(185, 160, 109, 0.75)); }
      }
      @keyframes sweepGold {
        0% { transform: translateX(-160px); opacity: 0; }
        20% { opacity: 0.25; }
        45%, 100% { transform: translateX(650px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow-gold, .laser-sweep-gold { animation: none; }
      }
    </style>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#14110A"/>
      <stop offset="1" stop-color="#1E190E"/>
    </linearGradient>
    <linearGradient id="goldAccent4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5C78A"/>
      <stop offset="1" stop-color="#B9A06D"/>
    </linearGradient>
    <linearGradient id="sheen4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid4" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#B9A06D" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="clip4">
      <rect width="580" height="92" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip4)">
    <!-- Base Background & Grid -->
    <rect width="580" height="92" fill="url(#bg4)"/>
    <rect width="580" height="92" fill="url(#grid4)"/>
    
    <!-- Animated Laser Sheen -->
    <rect class="laser-sweep-gold" x="0" y="0" width="130" height="92" fill="url(#sheen4)" transform="skewX(-20)"/>

    <!-- Left Accent Pill -->
    <rect width="5" height="92" fill="url(#goldAccent4)"/>

    <!-- Left Icon Squircle (52x52) -->
    <g transform="translate(20, 20)">
      <rect width="52" height="52" rx="13" fill="#241E12" stroke="#B9A06D" stroke-opacity="0.5" stroke-width="1.2"/>
      <g fill="none" stroke="#B9A06D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 26 15 L 29 20 L 35 21 L 31 25 L 32 31 L 26 28 L 20 31 L 21 25 L 17 21 L 23 20 Z"/>
        <path d="M 23 26 L 25 28 L 29 23"/>
      </g>
    </g>

    <!-- Typography — Sovereign Title Only -->
    <text x="92" y="53" fill="#F4F0E8" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.3">WALL OF PROOF</text>

    <!-- Outer Animated Glow Border -->
    <rect class="glow-gold" x="0.5" y="0.5" width="579" height="91" rx="13.5" fill="none" stroke="#B9A06D" stroke-width="1.2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="580" height="84" viewBox="0 0 580 84" role="img" aria-labelledby="title desc">
  <title id="title">View Upstream Wall of Proof</title>
  <desc id="desc">Browse 16 verified merged upstream pull requests across Hugging Face, Meta, DuckDB, etc.</desc>
  <defs>
    <style>
      .card-border-purple { animation: pulseGlowPurple 3s ease-in-out infinite; }
      .sheen-purple { animation: sheenPassPurple 6s ease-in-out infinite; }
      @keyframes pulseGlowPurple {
        0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 2px rgba(167, 139, 250, 0.25)); }
        50% { stroke-opacity: 0.85; filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.65)); }
      }
      @keyframes sheenPassPurple {
        0% { transform: translateX(-180px); opacity: 0; }
        25% { opacity: 0.20; }
        50%, 100% { transform: translateX(620px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card-border-purple, .sheen-purple { animation: none; }
      }
    </style>
    <linearGradient id="bgPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040913"/>
      <stop offset="0.5" stop-color="#0E1026"/>
      <stop offset="1" stop-color="#1A1838"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="sheenGradPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridPurple" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#75B5DE" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="cardClipPurple">
      <rect width="580" height="84" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClipPurple)">
    <rect width="580" height="84" fill="url(#bgPurple)"/>
    <rect width="580" height="84" fill="url(#gridPurple)"/>
    
    <rect class="sheen-purple" x="0" y="0" width="140" height="84" fill="url(#sheenGradPurple)" transform="skewX(-20)"/>

    <rect width="5" height="84" fill="url(#accentPurple)"/>

    <!-- Icon Box -->
    <g transform="translate(20, 18)">
      <rect width="48" height="48" rx="12" fill="#18152E" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.2"/>
      <g fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 24 13 L 27 18 L 33 19 L 29 23 L 30 29 L 24 26 L 18 29 L 19 23 L 15 19 L 21 18 Z"/>
        <path d="M 21 24 L 23 26 L 27 21"/>
      </g>
    </g>

    <text x="82" y="34" fill="#A78BFA" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" letter-spacing="2">16 TIER-1 SYSTEMS · 100% GREEN MERGES</text>
    <text x="82" y="58" fill="#F8FAFC" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.2">WALL OF PROOF</text>

    <!-- Right Action Pill -->
    <g transform="translate(440, 24)">
      <rect width="118" height="36" rx="9" fill="#201C3D" stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.2"/>
      <text x="48" y="23" text-anchor="middle" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">EXPLORE</text>
      <text x="98" y="23" text-anchor="middle" fill="#A78BFA" font-family="Arial, sans-serif" font-size="14" font-weight="900">↓</text>
    </g>

    <rect class="card-border-purple" x="0.5" y="0.5" width="579" height="83" rx="13.5" fill="none" stroke="#A78BFA" stroke-width="1.2"/>
  </g>
</svg>
